name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dedus
          POSTGRES_USER: dedus
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dedus -d dedus"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        working-directory: src/dedus
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: dedus
          DB_USERNAME: dedus
          DB_PASSWORD: ci-password
          JPA_DDL_AUTO: create-drop
          JWT_SECRET: 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
          JWT_EXPIRATION_SECONDS: '3600'
        run: ./gradlew --no-daemon build